[package]
name = "palace"
version = "0.25.2"
description = "A Git client for Linux"
authors = ["Tim McLeod"]
license = "MIT"
repository = "https://github.com/timmcleod/palace"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "palace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21.0", default-features = false }
tauri-plugin-dialog = "2"
libc = "0.2"
trash = "5.2.9"
notify = "8.2.1"
ureq = { version = "3", features = ["json"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.23"
portable-pty = "0.9.0"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"

# Signed-in GitHub tokens are kept in the desktop's keyring: the Secret Service on
# Linux, the Keychain on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# The web view's own widget, for turning off pinch to zoom. The versions Tauri uses.
gtk = "0.18"
# For sending notifications to the desktop's server ourselves (see notify.rs). The
# version the notification plugin uses.
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Not used directly: turns on the UNUserNotificationCenter backend of the notify-rust
# the notification plugin uses. Its default, NSUserNotification, deprecated since
# macOS 11, never reports a click, so a notification couldn't bring its tab forward.
# The new one needs a real .app, so `tauri dev` shows no system notifications.
notify-rust = { version = "4.18", features = ["preview-macos-un"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
