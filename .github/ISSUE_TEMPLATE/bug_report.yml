name: Bug report
description: Something in Palace doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Palace did instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can make it happen again, how.
      placeholder: |
        1. Open a repository with…
        2. Click…
  - type: input
    id: version
    attributes:
      label: Palace version
      description: It's at the top of Settings.
      placeholder: "0.40.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How Palace is installed
      options:
        - macOS (.dmg)
        - Linux (.deb)
        - Linux (AppImage)
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 15.5, Ubuntu 24.04 (Wayland)…
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: Git version
      description: The output of `git --version`, if it might matter.
