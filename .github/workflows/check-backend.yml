# Lints the backend with clippy and runs its tests on every push and pull request that
# changes it, so a regression shows up when it's made rather than when a release is
# tagged. Linux only: the release workflow still runs the tests on macOS before
# building for it.

name: Check backend

on:
  push:
    branches: ["**"]
    paths: &paths
      - "src-tauri/**"
      # A test checks that the page's error prefixes match the backend's.
      - "src/lib/errors.js"
      - ".github/workflows/check-backend.yml"
  pull_request:
    paths: *paths

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: check-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # A version of its own, as clippy with warnings as errors fails on lints a new
      # Rust adds, with nothing changed here. Raised by hand, its new lints fixed then.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Any warning fails the check, so they're fixed as they come up.
      - name: Lint the backend
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the backend tests
        working-directory: src-tauri
        run: cargo test
