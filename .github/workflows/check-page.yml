# Lints and builds the page and runs its tests on every push and pull request that
# changes it, so a regression shows up when it's made rather than when a release is
# tagged.

name: Check page

on:
  push:
    branches: ["**"]
    paths: &paths
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "eslint.config.js"
      - ".github/workflows/check-page.yml"
  pull_request:
    paths: *paths

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: check-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Names used but never defined, in scripts and templates alike, which the build
      # lets through (see eslint.config.js).
      - name: Lint the page
        run: npm run lint

      - name: Build the page
        run: npm run build

      - name: Run the page's tests
        run: npm test
