# Builds Palace's Linux packages.
#
# Pushing a version tag such as v1.2.0 (made in Palace, with `npm run release`, or
# with git) runs the tests, builds the .deb and AppImage with that version, and
# publishes them as a GitHub release. Running the workflow by hand from the Actions
# tab builds the packages without publishing anything, and attaches them to the run
# instead. Once a release is published, the website shows its version.

name: Release

on:
  push:
    # Only version tags; other tags starting with "v" aren't releases.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Packages built against an older Ubuntu also install on newer ones, not the
    # other way around.
    runs-on: ubuntu-22.04
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Run the backend tests
        working-directory: src-tauri
        run: cargo test

      # The tag decides the version, so tagging alone is enough to make a release.
      - name: Set the app's version from the tag
        if: env.IS_RELEASE == 'true'
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"

      # Releases also carry signed update files and a latest.json describing them,
      # which installed copies of Palace check for updates. The signing key lives in
      # the repository's secrets; Palace only installs updates signed with it.
      - name: Build and publish the release
        if: env.IS_RELEASE == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true
          tagName: ${{ github.ref_name }}
          releaseName: Palace ${{ github.ref_name }}
          releaseBody: |
            **Ubuntu / Debian:** download the `.deb`, then run
            `sudo apt install ./Palace_*.deb` in the folder you saved it to.

            **Other distributions:** download the `.AppImage`, make it executable
            (`chmod +x Palace_*.AppImage`) and run it. It needs `git` installed,
            and on Ubuntu 22.04 and later, `libfuse2` (`libfuse2t64` on 24.04 and later).
          releaseDraft: false

      - name: Build the packages
        if: env.IS_RELEASE != 'true'
        run: npm run package

      - name: Attach the packages to this run
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: palace-linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  website:
    # Only after the release is out, so the website never offers a version that
    # can't be downloaded yet.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      # Pushing to gh-pages republishes the site.
      - name: Show the new version on the website
        run: |
          version="${GITHUB_REF_NAME#v}"
          current=$(grep -oE 'Version [0-9]+\.[0-9]+\.[0-9]+' index.html | head -1 | cut -d' ' -f2)
          if [ -z "$current" ]; then
            echo "::error::index.html has no \"Version x.y.z\" to update."
            exit 1
          fi
          # Re-running an older release's workflow doesn't take the website back.
          if [ "$(printf '%s\n' "$current" "$version" | sort -V | tail -1)" != "$version" ] || [ "$current" = "$version" ]; then
            echo "The website already shows $current."
            exit 0
          fi
          sed -i -E "s/Version [0-9]+\.[0-9]+\.[0-9]+/Version $version/" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Show version $version"
          git push
