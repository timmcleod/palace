# Builds the page and runs the backend tests on every push and pull request, so a
# regression shows up when it's made rather than when a release is tagged. Linux only:
# the release workflow still runs the tests on macOS before building for it.

name: Check

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Catches imports that no longer resolve, which nothing else would until the app ran.
      - name: Build the page
        run: npm run build

      - name: Run the backend tests
        working-directory: src-tauri
        run: cargo test
