<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Drawn in the reference artwork's coordinates (the tile spans x 134–940), then
       scaled onto an 880px tile that leaves a margin like other desktop icons. -->
  <defs>
    <clipPath id="tile">
      <rect x="134" y="35" width="806" height="806" rx="183"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="35" x2="0" y2="631" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a4775"/>
      <stop offset="0.4" stop-color="#1e3459"/>
      <stop offset="1" stop-color="#132641"/>
    </linearGradient>
    <radialGradient id="vignette" cx="537" cy="380" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#0b1628" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1628" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="631" x2="0" y2="841" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f2441"/>
      <stop offset="1" stop-color="#0c1c35"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="377" x2="0" y2="571" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1e37"/>
      <stop offset="1" stop-color="#07162b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="524" x2="0" y2="841" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5aa8f3"/>
      <stop offset="0.45" stop-color="#62b0f8"/>
      <stop offset="1" stop-color="#56a3f2"/>
    </linearGradient>
    <linearGradient id="towerL" x1="0" y1="340" x2="0" y2="631" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ecf2fa"/>
      <stop offset="0.35" stop-color="#e2ecf8"/>
      <stop offset="1" stop-color="#8bbdf7"/>
    </linearGradient>
    <linearGradient id="towerR" x1="0" y1="340" x2="0" y2="631" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0f6fd"/>
      <stop offset="0.35" stop-color="#e8f2fc"/>
      <stop offset="1" stop-color="#98c6f9"/>
    </linearGradient>
    <linearGradient id="wallL" x1="300" y1="390" x2="392" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8e5f6"/>
      <stop offset="0.55" stop-color="#bcd2f0"/>
      <stop offset="1" stop-color="#4f88da"/>
    </linearGradient>
    <linearGradient id="wallR" x1="771" y1="390" x2="679" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dceafa"/>
      <stop offset="0.55" stop-color="#c3dbf8"/>
      <stop offset="1" stop-color="#67a3f3"/>
    </linearGradient>
    <linearGradient id="gateL" x1="0" y1="253" x2="0" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9ecf1"/>
      <stop offset="0.55" stop-color="#e3eaf4"/>
      <stop offset="1" stop-color="#94bff1"/>
    </linearGradient>
    <linearGradient id="gateR" x1="0" y1="253" x2="0" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcfcfd"/>
      <stop offset="0.55" stop-color="#f3f7fc"/>
      <stop offset="1" stop-color="#c6e0fa"/>
    </linearGradient>
  </defs>

  <g transform="matrix(1.09181 0 0 1.09181 -74.30 33.79)">
    <g clip-path="url(#tile)">
      <!-- Sky and ground -->
      <rect x="134" y="35" width="806" height="806" fill="url(#sky)"/>
      <rect x="134" y="631" width="806" height="210" fill="url(#ground)"/>
      <rect x="134" y="35" width="806" height="806" fill="url(#vignette)"/>

      <!-- Left tower and wall -->
      <path d="M222 360 L301 339 L300 606 L184 631 Z" fill="url(#towerL)"/>
      <path d="M301 399 L392 377 L385 588 L300 606 Z" fill="url(#wallL)"/>
      <path d="M301 339 L309 345 L309 397 L301 399 Z" fill="#3f5a87"/>

      <!-- Right tower and wall -->
      <path d="M849 360 L770 339 L771 606 L887 631 Z" fill="url(#towerR)"/>
      <path d="M770 399 L679 377 L686 588 L771 606 Z" fill="url(#wallR)"/>
      <path d="M770 339 L762 345 L762 397 L770 399 Z" fill="#5f7dab"/>

      <!-- Gatehouse: two faces meeting at a ridge above the arch -->
      <path d="M393.3 292.7 L454 278.3 L458.3 316 L500 304 L500.7 261.7 L535.5 252.7 L535.5 376.7
               A67.5 67.5 0 0 0 468 444.2 L468 570 L385 588 Z" fill="url(#gateL)"/>
      <path d="M677.7 292.7 L617 278.3 L612.7 316 L571 304 L570.3 261.7 L535.5 252.7 L535.5 376.7
               A67.5 67.5 0 0 1 603 444.2 L603 570 L686 588 Z" fill="url(#gateR)"/>
      <path d="M454 278.3 L466 284 L466 313 L458.3 316 Z" fill="#566c8d"/>
      <path d="M617 278.3 L605 284 L605 313 L612.7 316 Z" fill="#6a82a8"/>

      <!-- Through the gate -->
      <path d="M468 571 L468 444.2 A67.5 67.5 0 0 1 603 444.2 L603 571 Z" fill="url(#arch)"/>

      <!-- The road: two paths from the gate, out to the corners -->
      <path d="M504 524 L515 524 Q519 524 518.6 528 L511 640 L330 900 L60 900 L100 823 L177 777 L473 601 L500.4 528 Q501 524 504 524 Z"
            fill="url(#road)"/>
      <path d="M567 524 L556 524 Q552 524 552.4 528 L560 640 L741 900 L1011 900 L971 823 L894 777 L598 601 L570.6 528 Q570 524 567 524 Z"
            fill="url(#road)"/>
    </g>

    <!-- A fine light rim -->
    <rect x="135.5" y="36.5" width="803" height="803" rx="181.5" fill="none" stroke="#4d77c2" stroke-opacity="0.8" stroke-width="4"/>
  </g>
</svg>
